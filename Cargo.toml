[package]
name = "website_accessibility_monitor"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "website_accessibility_monitor"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "brotli", "gzip", "deflate", "stream", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winping = "0.10"

[[bin]]
name = "SiteMonitor"
path = "src/bin/sitemonitor.rs"

[[bin]]
name = "SiteMonitorLite"
path = "src/bin/sitemonitor_lite.rs"

[dev-dependencies]
tempfile = "3.22"
