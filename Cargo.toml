[package]
name = "website_accessibility_monitor"
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
description = "Console uptime monitor that tells outages from likely blocking"
repository = "https://github.com/ServChan/WebsiteAccessibilityMonitor"
homepage = "https://lts-server.com/projects/website-accessibility-monitor"
license = "MIT"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "brotli", "gzip", "deflate", "stream", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winping = "0.10"

[[bin]]
name = "wam"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.22"

[profile.release]
lto = "thin"
strip = true
